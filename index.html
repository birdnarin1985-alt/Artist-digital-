<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Formulas Voxel & Bio-Silicon Engine - Narin Inchai</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030712; font-family: monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body class="bg-gray-950 text-emerald-400 select-none">

    <!-- Header Overlay -->
    <div class="absolute top-0 left-0 w-full p-6 z-10 flex justify-between items-start pointer-events-none">
        <div>
            <h1 class="text-xl md:text-2xl font-bold tracking-wider text-emerald-400 flex items-center gap-2">
                <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
                5 Math Formulas & Bio-Silicon Voxel Engine
            </h1>
            <p class="text-xs text-gray-400 mt-1">ศิลปิน: นรินทร์ อินชัย (ช่างเบิร์ด) | โยนิโสโลจิก | 60 FPS Locked</p>
        </div>
        <div class="bg-gray-900/80 border border-emerald-500/30 backdrop-blur-md px-4 py-2 rounded-lg text-right text-xs shadow-lg">
            <div class="text-emerald-300 font-semibold">FPS: <span id="fps-counter">60</span></div>
            <div class="text-gray-400" id="active-formula-label">Mode: Hybrid DNA-GPU</div>
        </div>
    </div>

    <!-- Control Panel Footer (5 สมการ + โหมดพิเศษ) -->
    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-10 flex flex-wrap justify-center gap-2 md:gap-3 pointer-events-auto max-w-4xl px-4">
        <button onclick="switchMode('formula1', '1 + 2 + ... + n (Pyramid)')" class="px-3.5 py-2 bg-emerald-900/40 hover:bg-emerald-800/60 border border-emerald-500/50 text-emerald-300 text-xs font-bold rounded-xl backdrop-blur-md transition-all shadow-lg active:scale-95">
            📐 1+2+...+n
        </button>
        <button onclick="switchMode('formula2', '1/2 + 1/4 + ... = 1 (Square)')" class="px-3.5 py-2 bg-cyan-900/40 hover:bg-cyan-800/60 border border-cyan-500/50 text-cyan-300 text-xs font-bold rounded-xl backdrop-blur-md transition-all shadow-lg active:scale-95">
            🟦 อนุกรมอนันต์
        </button>
        <button onclick="switchMode('formula3', '(a+b)³ (Cube Matrix)')" class="px-3.5 py-2 bg-amber-900/40 hover:bg-amber-800/60 border border-amber-500/50 text-amber-300 text-xs font-bold rounded-xl backdrop-blur-md transition-all shadow-lg active:scale-95">
            🧊 (a+b)³
        </button>
        <button onclick="switchMode('formula4', '4/3 πr³ (Sphere)')" class="px-3.5 py-2 bg-rose-900/40 hover:bg-rose-800/60 border border-rose-500/50 text-rose-300 text-xs font-bold rounded-xl backdrop-blur-md transition-all shadow-lg active:scale-95">
            🔮 4/3 πr³
        </button>
        <button onclick="switchMode('formula5', 'π² / 6 (Basel Problem)')" class="px-3.5 py-2 bg-purple-900/40 hover:bg-purple-800/60 border border-purple-500/50 text-purple-300 text-xs font-bold rounded-xl backdrop-blur-md transition-all shadow-lg active:scale-95">
            🪐 π²/6
        </button>
        <button onclick="switchMode('hybrid', 'Hybrid DNA-GPU Injection')" class="px-3.5 py-2 bg-blue-900/40 hover:bg-blue-800/60 border border-blue-500/50 text-blue-300 text-xs font-bold rounded-xl backdrop-blur-md transition-all shadow-lg active:scale-95">
            🧬 Bio-Silicon
        </button>
    </div>

    <!-- Three.js Engine Script -->
    <script>
        let scene, camera, renderer, voxelGroup;
        let currentMode = 'hybrid';
        let clock = new THREE.Clock();
        let frameCount = 0;
        let lastTime = performance.now();
        let fpsElem = document.getElementById('fps-counter');
        let labelElem = document.getElementById('active-formula-label');

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.025);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 35);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x10b981, 2.5, 60);
            pointLight.position.set(15, 15, 15);
            scene.add(pointLight);

            const pointLight2 = new THREE.PointLight(0x3b82f6, 2.5, 60);
            pointLight2.position.set(-15, -15, 15);
            scene.add(pointLight2);

            buildVoxels();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function buildVoxels() {
            if (voxelGroup) scene.remove(voxelGroup);
            voxelGroup = new THREE.Group();

            const geom = new THREE.BoxGeometry(0.6, 0.6, 0.6);

            if (currentMode === 'formula1') {
                // 1+2+...+n : Triangular Pyramid
                let levels = 8;
                for (let i = 0; i < levels; i++) {
                    let y = (i - levels / 2) * 1.2;
                    let count = i + 1;
                    for (let j = 0; j < count; j++) {
                        let x = (j - count / 2 + 0.5) * 1.2;
                        let mat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x047857, metalness: 0.8, roughness: 0.2 });
                        let mesh = new THREE.Mesh(geom, mat);
                        mesh.position.set(x, y, 0);
                        voxelGroup.add(mesh);
                    }
                }
            } 
            else if (currentMode === 'formula2') {
                // 1/2 + 1/4 + ... = 1 : Nested Square Sections
                let size = 10;
                let xOffset = 0, yOffset = 0;
                for (let i = 0; i < 6; i++) {
                    let mat = new THREE.MeshStandardMaterial({ 
                        color: new THREE.Color().setHSL(i * 0.15, 0.8, 0.5), 
                        roughness: 0.3, metalness: 0.5 
                    });
                    // สร้างกรอบสี่เหลี่ยมย่อย
                    let sBox = new THREE.Mesh(new THREE.BoxGeometry(size, size, 0.5), mat);
                    sBox.position.set(xOffset + size/2 - 5, yOffset + size/2 - 5, 0);
                    voxelGroup.add(sBox);
                    
                    xOffset += size;
                    size /= 2;
                }
            }
            else if (currentMode === 'formula3') {
                // (a+b)^3 : Cubic Matrix Volume Breakdown
                let size = 3;
                let spacing = 1.2;
                for (let x = 0; x < size; x++) {
                    for (let y = 0; y < size; y++) {
                        for (let z = 0; z < size; z++) {
                            let mat = new THREE.MeshStandardMaterial({
                                color: (x === 0 && y === 0 && z === 0) ? 0xf59e0b : 0x3b82f6,
                                emissive: 0x1d4ed8,
                                metalness: 0.7,
                                roughness: 0.2
                            });
                            let mesh = new THREE.Mesh(geom, mat);
                            mesh.position.set((x - 1) * spacing, (y - 1) * spacing, (z - 1) * spacing);
                            voxelGroup.add(mesh);
                        }
                    }
                }
            }
            else if (currentMode === 'formula4') {
                // 4/3 πr^3 : Sphere Voxel Matrix
                let radius = 6;
                let step = 1.2;
                for (let x = -radius; x <= radius; x += step) {
                    for (let y = -radius; y <= radius; y += step) {
                        for (let z = -radius; z <= radius; z += step) {
                            if (Math.sqrt(x*x + y*y + z*z) <= radius) {
                                let mat = new THREE.MeshStandardMaterial({
                                    color: 0xf43f5e,
                                    emissive: 0xbe123c,
                                    metalness: 0.8,
                                    roughness: 0.2
                                });
                                let mesh = new THREE.Mesh(geom, mat);
                                mesh.position.set(x, y, z);
                                voxelGroup.add(mesh);
                            }
                        }
                    }
                }
            }
            else if (currentMode === 'formula5') {
                // π^2 / 6 : Basel Problem Harmonic Series Spiral
                let count = 100;
                for (let i = 1; i <= count; i++) {
                    let angle = i * 0.5;
                    let radius = Math.sqrt(i) * 0.8;
                    let x = Math.cos(angle) * radius;
                    let z = Math.sin(angle) * radius;
                    let y = (1 / (i * i)) * 30 - 5; // สัดส่วนตาม 1/n^2
                    
                    let mat = new THREE.MeshStandardMaterial({
                        color: 0xa855f7,
                        emissive: 0x7e22ce,
                        metalness: 0.9,
                        roughness: 0.1
                    });
                    let mesh = new THREE.Mesh(geom, mat);
                    mesh.position.set(x, y, z);
                    voxelGroup.add(mesh);
                }
            }
            else if (currentMode === 'hybrid') {
                // Hybrid DNA Helix & GPU Grid
                let turns = 3;
                let pointsPerTurn = 25;
                for (let i = 0; i < turns * pointsPerTurn; i++) {
                    let t = (i / pointsPerTurn) * Math.PI * 2;
                    let y = (i / (turns * pointsPerTurn)) * 16 - 8;
                    let x1 = Math.cos(t) * 4;
                    let z1 = Math.sin(t) * 4;

                    let m1 = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x047857 }));
                    m1.position.set(x1, y, z1);
                    voxelGroup.add(m1);

                    let m2 = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color: 0x06b6d4, emissive: 0x0e7490 }));
                    m2.position.set(-x1, y, -z1);
                    voxelGroup.add(m2);
                }
            }

            scene.add(voxelGroup);
        }

        function switchMode(mode, labelText) {
            currentMode = mode;
            labelElem.innerText = "Mode: " + labelText;
            buildVoxels();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // FPS Calculation
            frameCount++;
            let time = performance.now();
            if (time - lastTime >= 1000) {
                fpsElem.innerText = Math.round((frameCount * 1000) / (time - lastTime));
                frameCount = 0;
                lastTime = time;
            }

            let delta = clock.getDelta();
            if (voxelGroup) {
                voxelGroup.rotation.y += delta * 0.4;
                voxelGroup.rotation.x = Math.sin(clock.getElapsedTime() * 0.4) * 0.15;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
