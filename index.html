<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bio-Silicon 1M FFT & Laplace Engine - Narin Inchai</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #010409; font-family: monospace; -webkit-tap-highlight-color: transparent; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .glass-sexy {
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 12px rgba(16, 185, 129, 0.08);
        }
        .scroll-sexy::-webkit-scrollbar { width: 3px; }
        .scroll-sexy::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.4); border-radius: 4px; }
    </style>
</head>
<body class="bg-[#010409] text-emerald-400 select-none">

    <!-- iPhone 17 Pro Optimized Header -->
    <div class="absolute top-3 left-3 right-3 z-10 flex justify-between items-center pointer-events-none">
        <div class="glass-sexy px-3 py-2 rounded-xl pointer-events-auto">
            <h1 class="text-xs font-bold tracking-widest text-emerald-400 flex items-center gap-1.5">
                <span class="inline-block w-2 h-2 bg-emerald-400 rounded-full animate-ping shadow-[0_0_8px_#10b981]"></span>
                IP17 PRO // 1M DUST
            </h1>
            <p class="text-[9px] text-gray-400 mt-0.5">ช่างเบิร์ด | โยนิโสโลจิก</p>
        </div>
        <div class="glass-sexy px-3 py-2 rounded-xl text-right pointer-events-auto">
            <div class="text-emerald-300 text-xs font-bold">FPS: <span id="fps-counter">60</span></div>
            <div class="text-[9px] text-rose-400 font-mono" id="active-label">1M NEBULA</div>
        </div>
    </div>

    <!-- Sleek Interactive Link List Hub (มุมขวาบน) -->
    <div class="absolute top-20 right-3 z-20">
        <div class="glass-sexy p-2.5 rounded-2xl flex flex-col gap-1.5 shadow-2xl w-32">
            <div class="text-[9px] text-gray-400 tracking-wider text-center border-b border-gray-800 pb-1">🔗 LINK HUB</div>
            <a href="https://github.com" target="_blank" class="text-[10px] text-cyan-300 hover:text-white bg-cyan-950/40 hover:bg-cyan-900/60 px-2 py-1 rounded-md transition text-center border border-cyan-500/30">
                📂 GitHub
            </a>
            <a href="https://github.com" target="_blank" class="text-[10px] text-amber-300 hover:text-white bg-amber-950/40 hover:bg-amber-900/60 px-2 py-1 rounded-md transition text-center border border-amber-500/30">
                ⚡ FFT / Laplace
            </a>
            <a href="https://github.com" target="_blank" class="text-[10px] text-purple-300 hover:text-white bg-purple-950/40 hover:bg-purple-900/60 px-2 py-1 rounded-md transition text-center border border-purple-500/30">
                🧬 Bio-Silicon
            </a>
        </div>
    </div>

    <!-- Sexy Control Panel Footer (รวม 5 สูตร + FFT + Laplace ครบครันสำหรับ iPhone 17 Pro) -->
    <div class="absolute bottom-3 left-3 right-3 z-10">
        <div class="glass-sexy p-2.5 rounded-2xl flex flex-col gap-2 shadow-2xl">
            <div class="text-[9px] text-gray-400 text-center tracking-widest border-b border-emerald-500/20 pb-1">MATH & BIO-SILICON 1M ENGINE</div>
            <div class="grid grid-cols-4 gap-1.5">
                <button onclick="switchMode('formula1', '1+2+...+n Pyramid')" class="py-1.5 bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-500/40 text-emerald-300 text-[9px] font-bold rounded-lg transition active:scale-95 text-center shadow">
                    📐 1+2..n
                </button>
                <button onclick="switchMode('formula2', 'Series 1/2+1/4=1')" class="py-1.5 bg-cyan-950/50 hover:bg-cyan-900/80 border border-cyan-500/40 text-cyan-300 text-[9px] font-bold rounded-lg transition active:scale-95 text-center shadow">
                    🟦 อนุกรม
                </button>
                <button onclick="switchMode('formula3', '(a+b)³ Cube Matrix')" class="py-1.5 bg-amber-950/50 hover:bg-amber-900/80 border border-amber-500/40 text-amber-300 text-[9px] font-bold rounded-lg transition active:scale-95 text-center shadow">
                    🧊 (a+b)³
                </button>
                <button onclick="switchMode('formula4', '4/3 πr³ Sphere')" class="py-1.5 bg-rose-950/50 hover:bg-rose-900/80 border border-rose-500/40 text-rose-300 text-[9px] font-bold rounded-lg transition active:scale-95 text-center shadow">
                    🔮 4/3πr³
                </button>
                <button onclick="switchMode('formula5', 'π²/6 Basel Problem')" class="py-1.5 bg-purple-950/50 hover:bg-purple-900/80 border border-purple-500/40 text-purple-300 text-[9px] font-bold rounded-lg transition active:scale-95 text-center shadow">
                    🪐 π²/6
                </button>
                <button onclick="switchMode('fftSeries', 'Fast Fourier Transform')" class="py-1.5 bg-blue-950/50 hover:bg-blue-900/80 border border-blue-500/40 text-blue-300 text-[9px] font-bold rounded-lg transition active:scale-95 text-center shadow">
                    ⚡ FFT
                </button>
                <button onclick="switchMode('laplaceTransform', 'Laplace Transform')" class="py-1.5 bg-indigo-950/50 hover:bg-indigo-900/80 border border-indigo-500/40 text-indigo-300 text-[9px] font-bold rounded-lg transition active:scale-95 text-center shadow">
                    🌀 Laplace
                </button>
                <button onclick="switchMode('hybrid', 'Bio-Silicon DNA')" class="py-1.5 bg-teal-950/50 hover:bg-teal-900/80 border border-teal-500/40 text-teal-300 text-[9px] font-bold rounded-lg transition active:scale-95 text-center shadow">
                    🧬 Bio-Si
                </button>
            </div>
        </div>
    </div>

    <!-- Three.js 1M Voxel Dust Engine -->
    <script>
        let scene, camera, renderer, particleSystem, geometry;
        let currentMode = 'formula1';
        let clock = new THREE.Clock();
        let frameCount = 0;
        let lastTime = performance.now();
        let fpsElem = document.getElementById('fps-counter');
        let labelElem = document.getElementById('active-label');

        const PARTICLE_COUNT = 1000000; // 1 ล้านพาร์ติเคิลฝุ่น

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010409, 0.012);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 35);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            buildParticles();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function buildParticles() {
            if (particleSystem) scene.remove(particleSystem);

            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            let colorBase = new THREE.Color();

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let i3 = i * 3;

                if (currentMode === 'formula1') {
                    // 1+2+...+n : Triangular Pyramid Dust
                    let rIdx = Math.random();
                    let y = (Math.random() - 0.5) * 16;
                    let width = (8 - y * 0.5);
                    let x = (Math.random() - 0.5) * Math.max(0, width);
                    let z = (Math.random() - 0.5) * Math.max(0, width);
                    positions[i3] = x; positions[i3 + 1] = y; positions[i3 + 2] = z;
                    colorBase.setHSL(0.42, 0.9, 0.55);
                } 
                else if (currentMode === 'formula2') {
                    // 1/2 + 1/4 + ... = 1 : Nested Infinite Series Squares
                    let size = 12 * Math.pow(0.5, (i % 5));
                    positions[i3] = (Math.random() - 0.5) * size;
                    positions[i3 + 1] = (Math.random() - 0.5) * size;
                    positions[i3 + 2] = (Math.random() - 0.5) * 2;
                    colorBase.setHSL(0.55 + (i % 5) * 0.1, 0.9, 0.6);
                }
                else if (currentMode === 'formula3') {
                    // (a+b)^3 : Cubic Volume Matrix Dust
                    positions[i3] = (Math.random() - 0.5) * 15;
                    positions[i3 + 1] = (Math.random() - 0.5) * 15;
                    positions[i3 + 2] = (Math.random() - 0.5) * 15;
                    colorBase.setHSL(0.12, 0.9, 0.55);
                }
                else if (currentMode === 'formula4') {
                    // 4/3 πr^3 : Sphere Voxel Dust
                    const u = Math.random(), v = Math.random();
                    const theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
                    const r = Math.cbrt(Math.random()) * 10;
                    positions[i3] = r * Math.sin(phi) * Math.cos(theta);
                    positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                    positions[i3 + 2] = r * Math.cos(phi);
                    colorBase.setHSL(0.95, 0.9, 0.6);
                }
                else if (currentMode === 'formula5') {
                    // π^2 / 6 : Basel Problem Harmonic Spiral Dust
                    let idx = (i % 90000) + 1;
                    let angle = idx * 0.005;
                    let radius = Math.sqrt(idx) * 0.04;
                    positions[i3] = Math.cos(angle) * radius * 15;
                    positions[i3 + 1] = (1 / (idx * 0.0001)) * 5 - 10;
                    positions[i3 + 2] = Math.sin(angle) * radius * 15;
                    colorBase.setHSL(0.78, 0.9, 0.6);
                }
                else if (currentMode === 'fftSeries') {
                    // Fast Fourier Transform (FFT) Frequency Spectrum Wave
                    let x = (i / PARTICLE_COUNT) * 30 - 15;
                    let freq1 = Math.sin(x * 2.0);
                    let freq2 = Math.cos(x * 5.0) * 0.5;
                    let freq3 = Math.sin(x * 12.0) * 0.2;
                    positions[i3] = x;
                    positions[i3 + 1] = (freq1 + freq2 + freq3) * 4;
                    positions[i3 + 2] = (Math.random() - 0.5) * 6;
                    colorBase.setHSL(0.58, 0.95, 0.65);
                }
                else if (currentMode === 'laplaceTransform') {
                    // Laplace Transform Complex S-Plane Surface 3D
                    let uVal = (i / PARTICLE_COUNT) * 10 - 5;
                    let vVal = ((i % 1000) / 1000) * 10 - 5;
                    positions[i3] = uVal;
                    positions[i3 + 1] = Math.sin(Math.sqrt(uVal*uVal + vVal*vVal)) / (Math.sqrt(uVal*uVal + vVal*vVal) + 0.5) * 6;
                    positions[i3 + 2] = vVal;
                    colorBase.setHSL(0.85, 0.9, 0.6);
                }
                else if (currentMode === 'hybrid') {
                    // Bio-Silicon DNA / Silicon Core Voxel Dust
                    const t = (i / PARTICLE_COUNT) * Math.PI * 30;
                    const radius = 6;
                    const strand = (i % 2 === 0) ? 1 : -1;
                    positions[i3] = Math.cos(t) * radius * strand;
                    positions[i3 + 1] = (i / PARTICLE_COUNT) * 30 - 15;
                    positions[i3 + 2] = Math.sin(t) * radius * strand;
                    colorBase.setHSL(0.35, 0.9, 0.55);
                }

                colors[i3] = colorBase.r;
                colors[i3 + 1] = colorBase.g;
                colors[i3 + 2] = colorBase.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.09,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.9
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }

        function switchMode(mode, labelText) {
            currentMode = mode;
            labelElem.innerText = labelText;
            buildParticles();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            frameCount++;
            let time = performance.now();
            if (time - lastTime >= 1000) {
                fpsElem.innerText = Math.round((frameCount * 1000) / (time - lastTime));
                frameCount = 0;
                lastTime = time;
            }

            let delta = clock.getDelta();
            if (particleSystem) {
                particleSystem.rotation.y += delta * 0.12;
                particleSystem.rotation.x = Math.sin(clock.getElapsedTime() * 0.25) * 0.08;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
