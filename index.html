<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bio-Silicon 1M Dust - Narin Inchai</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #010409; font-family: monospace; -webkit-tap-highlight-color: transparent; }
        canvas { display: block; width: 100vw; height: 100vh; }
        /* Custom smooth glassmorphism */
        .glass-sexy {
            background: rgba(3, 7, 18, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(16, 185, 129, 0.25);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(16, 185, 129, 0.05);
        }
    </style>
</head>
<body class="bg-[#010409] text-emerald-400 select-none">

    <!-- iPhone 17 Pro Optimized Header -->
    <div class="absolute top-3 left-3 right-3 z-10 flex justify-between items-center pointer-events-none">
        <div class="glass-sexy px-3 py-2 rounded-xl pointer-events-auto">
            <h1 class="text-xs font-bold tracking-widest text-emerald-400 flex items-center gap-1.5">
                <span class="inline-block w-2 h-2 bg-emerald-400 rounded-full animate-ping shadow-[0_0_8px_#10b981]"></span>
                IP17 PRO // 1M DUST
            </h1>
            <p class="text-[9px] text-gray-400 mt-0.5">ช่างเบิร์ด | โยนิโสโลจิก</p>
        </div>
        <div class="glass-sexy px-3 py-2 rounded-xl text-right pointer-events-auto">
            <div class="text-emerald-300 text-xs font-bold">FPS: <span id="fps-counter">60</span></div>
            <div class="text-[9px] text-rose-400 font-mono" id="active-label">1M NEBULA</div>
        </div>
    </div>

    <!-- Sleek Interactive Link List (Drawer / Hub) -->
    <div id="link-drawer" class="absolute top-20 right-3 z-20 transition-all duration-300 transform translate-x-36 opacity-80 hover:opacity-100">
        <div class="glass-sexy p-2.5 rounded-2xl flex flex-col gap-2 shadow-2xl">
            <div class="text-[9px] text-gray-400 tracking-wider text-center border-b border-gray-800 pb-1">🔗 LINK HUB</div>
            <a href="https://github.com" target="_blank" class="text-[10px] text-cyan-300 hover:text-white bg-cyan-950/40 hover:bg-cyan-900/60 px-2.5 py-1.5 rounded-lg transition text-center border border-cyan-500/30">
                📂 GitHub Source
            </a>
            <a href="https://github.com" target="_blank" class="text-[10px] text-amber-300 hover:text-white bg-amber-950/40 hover:bg-amber-900/60 px-2.5 py-1.5 rounded-lg transition text-center border border-amber-500/30">
                ⚡ GPU Architecture
            </a>
            <a href="https://github.com" target="_blank" class="text-[10px] text-purple-300 hover:text-white bg-purple-950/40 hover:bg-purple-900/60 px-2.5 py-1.5 rounded-lg transition text-center border border-purple-500/30">
                🧬 DNA Helix Code
            </a>
        </div>
    </div>

    <!-- Sexy Control Panel Footer (Calibrated for iPhone 17 Pro Screen) -->
    <div class="absolute bottom-4 left-3 right-3 z-10">
        <div class="glass-sexy p-2.5 rounded-2xl flex justify-around items-center gap-1.5 shadow-2xl">
            <button onclick="switchMode('dustCluster', '1M NEBULA')" class="flex-1 py-2 bg-emerald-950/50 hover:bg-emerald-900/80 border border-emerald-500/40 text-emerald-300 text-[10px] font-bold rounded-xl transition active:scale-95 text-center shadow">
                ✨ เนบิวลา
            </button>
            <button onclick="switchMode('dnaVortex', 'DNA VORTEX')" class="flex-1 py-2 bg-cyan-950/50 hover:bg-cyan-900/80 border border-cyan-500/40 text-cyan-300 text-[10px] font-bold rounded-xl transition active:scale-95 text-center shadow">
                🧬 เกลียว DNA
            </button>
            <button onclick="switchMode('siliconGrid', 'SILICON CORE')" class="flex-1 py-2 bg-rose-950/50 hover:bg-rose-900/80 border border-rose-500/40 text-rose-300 text-[10px] font-bold rounded-xl transition active:scale-95 text-center shadow">
                ⚡ ซิลิคอน
            </button>
        </div>
    </div>

    <!-- Three.js 1M Voxel Dust Engine -->
    <script>
        let scene, camera, renderer, particleSystem, geometry;
        let currentMode = 'dustCluster';
        let clock = new THREE.Clock();
        let frameCount = 0;
        let lastTime = performance.now();
        let fpsElem = document.getElementById('fps-counter');
        let labelElem = document.getElementById('active-label');

        const PARTICLE_COUNT = 1000000; // 1 ล้านพาร์ติเคิลฝุ่น

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010409, 0.012);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 35);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            buildParticles();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function buildParticles() {
            if (particleSystem) scene.remove(particleSystem);

            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            let colorBase = new THREE.Color();

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let i3 = i * 3;

                if (currentMode === 'dustCluster') {
                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * 2.0 * Math.PI;
                    const phi = Math.acos(2.0 * v - 1.0);
                    const r = Math.cbrt(Math.random()) * 18;

                    positions[i3] = r * Math.sin(phi) * Math.cos(theta);
                    positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                    positions[i3 + 2] = r * Math.cos(phi);

                    colorBase.setHSL(0.42 + Math.random() * 0.12, 0.9, 0.55);
                } 
                else if (currentMode === 'dnaVortex') {
                    const t = (i / PARTICLE_COUNT) * Math.PI * 36;
                    const radius = 7 + (Math.random() - 0.5) * 1.5;
                    const strand = (i % 2 === 0) ? 1 : -1;

                    positions[i3] = Math.cos(t) * radius * strand;
                    positions[i3 + 1] = (i / PARTICLE_COUNT) * 35 - 17.5;
                    positions[i3 + 2] = Math.sin(t) * radius * strand;

                    colorBase.setHSL(0.55 + (i / PARTICLE_COUNT) * 0.25, 0.95, 0.6);
                }
                else if (currentMode === 'siliconGrid') {
                    const size = 1000;
                    const x = ((i % 1000) - 500) * 0.035;
                    const z = ((Math.floor(i / 1000) - 500) * 0.035);
                    const y = Math.sin(x * 1.5) * Math.cos(z * 1.5) * 3;

                    positions[i3] = x * 10;
                    positions[i3 + 1] = y - 4;
                    positions[i3 + 2] = z * 10;

                    colorBase.setHSL(0.95, 0.9, 0.55); // โทนชมพูโรสเซ็กซี่
                }

                colors[i3] = colorBase.r;
                colors[i3 + 1] = colorBase.g;
                colors[i3 + 2] = colorBase.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.9
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }

        function switchMode(mode, labelText) {
            currentMode = mode;
            labelElem.innerText = labelText;
            buildParticles();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            frameCount++;
            let time = performance.now();
            if (time - lastTime >= 1000) {
                fpsElem.innerText = Math.round((frameCount * 1000) / (time - lastTime));
                frameCount = 0;
                lastTime = time;
            }

            let delta = clock.getDelta();
            if (particleSystem) {
                particleSystem.rotation.y += delta * 0.12;
                particleSystem.rotation.x = Math.sin(clock.getElapsedTime() * 0.25) * 0.08;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
