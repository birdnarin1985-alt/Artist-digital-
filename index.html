<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Million Voxel Dust Engine - Narin Inchai</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030712; font-family: monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body class="bg-gray-950 text-emerald-400 select-none">

    <!-- Header Overlay -->
    <div class="absolute top-0 left-0 w-full p-4 z-10 flex justify-between items-start pointer-events-none">
        <div>
            <h1 class="text-sm md:text-xl font-bold tracking-wider text-emerald-400 flex items-center gap-2">
                <span class="inline-block w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></span>
                1 Million Voxel Dust Matrix
            </h1>
            <p class="text-[10px] md:text-xs text-gray-400 mt-0.5">ศิลปิน: นรินทร์ อินชัย (ช่างเบิร์ด) | โยนิโสโลจิก | 60 FPS Locked</p>
        </div>
        <div class="bg-gray-900/90 border border-emerald-500/30 backdrop-blur-md px-3 py-1.5 rounded-lg text-right text-xs shadow-lg pointer-events-auto">
            <div class="text-emerald-300 font-semibold">FPS: <span id="fps-counter">60</span></div>
            <div class="text-gray-400 text-[10px]" id="active-formula-label">Mode: 1M Particle Dust</div>
        </div>
    </div>

    <!-- Control Panel Footer -->
    <div class="absolute bottom-4 left-0 w-full z-10 flex flex-wrap justify-center gap-1.5 px-3 pointer-events-auto">
        <button onclick="switchMode('dustCluster', '1M Voxel Dust Nebula')" class="px-3 py-1.5 bg-emerald-950/80 hover:bg-emerald-800/80 border border-emerald-500/50 text-emerald-300 text-xs font-bold rounded-lg backdrop-blur-md transition-all active:scale-95 shadow">
            ✨ ฝุ่น 1 ล้านเนบิวลา
        </button>
        <button onclick="switchMode('dnaVortex', '1M DNA Dust Vortex')" class="px-3 py-1.5 bg-cyan-950/80 hover:bg-cyan-800/80 border border-cyan-500/50 text-cyan-300 text-xs font-bold rounded-lg backdrop-blur-md transition-all active:scale-95 shadow">
            🧬 ฝุ่น DNA เกลียว
        </button>
        <button onclick="switchMode('siliconGrid', '1M Silicon Core Matrix')" class="px-3 py-1.5 bg-amber-950/80 hover:bg-amber-800/80 border border-amber-500/50 text-amber-300 text-xs font-bold rounded-lg backdrop-blur-md transition-all active:scale-95 shadow">
            ⚡ ซิลิคอน คอร์
        </button>
    </div>

    <!-- Three.js Engine Script -->
    <script>
        let scene, camera, renderer, particleSystem, geometry;
        let currentMode = 'dustCluster';
        let clock = new THREE.Clock();
        let frameCount = 0;
        let lastTime = performance.now();
        let fpsElem = document.getElementById('fps-counter');
        let labelElem = document.getElementById('active-formula-label');

        const PARTICLE_COUNT = 1000000; // 1 ล้านดัช (1 ล้านพาร์ติเคิล)

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 40);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            buildParticles();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function buildParticles() {
            if (particleSystem) scene.remove(particleSystem);

            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);

            let colorBase = new THREE.Color();

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let i3 = i * 3;

                if (currentMode === 'dustCluster') {
                    // กระจายตัวแบบกลุ่มฝุ่นเนบิวลา 3 มิติ
                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * 2.0 * Math.PI;
                    const phi = Math.acos(2.0 * v - 1.0);
                    const r = Math.cbrt(Math.random()) * 20;

                    positions[i3] = r * Math.sin(phi) * Math.cos(theta);
                    positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                    positions[i3 + 2] = r * Math.cos(phi);

                    colorBase.setHSL(0.4 + Math.random() * 0.15, 0.8, 0.5);
                } 
                else if (currentMode === 'dnaVortex') {
                    // เกลียว DNA 1 ล้านฝุ่น
                    const t = (i / PARTICLE_COUNT) * Math.PI * 40;
                    const radius = 8 + (Math.random() - 0.5) * 2;
                    const strand = (i % 2 === 0) ? 1 : -1;

                    positions[i3] = Math.cos(t) * radius * strand;
                    positions[i3 + 1] = (i / PARTICLE_COUNT) * 40 - 20;
                    positions[i3 + 2] = Math.sin(t) * radius * strand;

                    colorBase.setHSL(0.5 + (i / PARTICLE_COUNT) * 0.3, 0.9, 0.6);
                }
                else if (currentMode === 'siliconGrid') {
                    // โครงสร้างเมทริกซ์ซีลิคอน CPU/GPU
                    const size = 100;
                    const x = (i % size) - size / 2;
                    const z = (Math.floor(i / size) % size) - size / 2;
                    const y = Math.sin(x * 0.2) * Math.cos(z * 0.2) * 4;

                    positions[i3] = x * 0.4;
                    positions[i3 + 1] = y - 5;
                    positions[i3 + 2] = z * 0.4;

                    colorBase.setHSL(0.12, 0.9, 0.5); // สีทองแดงซิลิคอน
                }

                colors[i3] = colorBase.r;
                colors[i3 + 1] = colorBase.g;
                colors[i3 + 2] = colorBase.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // ใช้ PointsMaterial น้ำหนักเบา เรนเดอร์ 1 ล้านจุดสบายๆ
            const material = new THREE.PointsMaterial({
                size: 0.12,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.85
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }

        function switchMode(mode, labelText) {
            currentMode = mode;
            labelElem.innerText = labelText;
            buildParticles();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // FPS Calculation
            frameCount++;
            let time = performance.now();
            if (time - lastTime >= 1000) {
                fpsElem.innerText = Math.round((frameCount * 1000) / (time - lastTime));
                frameCount = 0;
                lastTime = time;
            }

            let delta = clock.getDelta();
            if (particleSystem) {
                particleSystem.rotation.y += delta * 0.15;
                particleSystem.rotation.x = Math.sin(clock.getElapsedTime() * 0.3) * 0.1;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
